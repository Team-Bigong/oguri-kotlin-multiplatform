name: web-ci

on:
  push:
    branches:
      - release-web
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches:
      - release-web
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify travel invitation routing
        run: npm test

      - name: Build and verify invitation files
        env:
          ANDROID_APP_LINKS_SHA256: "AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA"
          IOS_UNIVERSAL_LINKS_APP_ID: "EXAMPLE123.com.bigong.oguri"
        run: |
          npm run build
          node scripts/verifyTravelInvite.mjs
