name: backend-cd

on:
  workflow_run:
    workflows:
      - backend-ci
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy hook
        env:
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK_URL is not set"
            exit 1
          fi

          curl --fail --show-error --silent \
            --request POST \
            "${RENDER_BACKEND_DEPLOY_HOOK_URL}"
