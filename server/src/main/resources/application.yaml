spring:
  application:
    name: oguri-api

  config:
    import: "optional:application-local.yaml"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oguri}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${PORT:8080}

jwt:
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}
  refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}

apple:
  client-id: ${APPLE_CLIENT_ID:}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
  session-secret: ${ADMIN_SESSION_SECRET:}
  session-validity-seconds: ${ADMIN_SESSION_VALIDITY_SECONDS:28800}
